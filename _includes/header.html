<header class="site-header" role="banner">
  <div class="wrapper">

    <div class="header-top">
      <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="{{ site.title | escape }}" class="site-logo">
        {% endif %}
        <span class="site-name">{{ site.title | escape }}</span>
      </a>
    </div>

    <nav class="site-nav">
      <ul class="nav-links">
        <li><a href="{{ '/geography/' | relative_url }}" class="{% if page.url contains '/geography/' %}active{% endif %}">Geography</a></li>
        <li><a href="{{ '/math/' | relative_url }}" class="{% if page.url contains '/math/' %}active{% endif %}">Math</a></li>
        <li><a href="{{ '/cs/' | relative_url }}" class="{% if page.url contains '/cs/' %}active{% endif %}">CS</a></li>
        <li><a href="{{ '/museum' | relative_url }}" class="{% if page.url contains '/museum/' %}active{% endif %}">Museum</a></li>
        <li><a href="{{ '/about/' | relative_url }}" class="{% if page.url contains '/about/' %}active{% endif %}">About</a></li>
      </ul>
    </nav>

  </div>
</header>
